<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gewohnheiten</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c1f24; --muted: #6b7280;
    --line: #e4e7eb; --accent: #0b7fd6; --ok: #188a4a; --warn: #b7791f;
    --track: #e9edf2; --chip: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --card: #1b1e22; --text: #e7e9ec; --muted: #9aa3ad;
      --line: #2a2f35; --accent: #4aa8ff; --ok: #3ccf7a; --warn: #e7b04a;
      --track: #2a2f35; --chip: #252a30;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 6px; vertical-align: 1px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card);
           color: var(--text); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
         flex-wrap: wrap; }
  .title { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px;
          padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); }
  .bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  @media (max-width: 560px) { .bars { grid-template-columns: 1fr; } }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px;
               color: var(--muted); margin-bottom: 4px; }
  .track { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .fill.full { background: var(--ok); }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
  .why { font-size: 13px; color: var(--muted); margin-top: 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 6px 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat .n { font-size: 22px; font-weight: 600; }
  .error { color: #c0392b; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Gewohnheiten</h1>
      <div class="meta" id="meta">Lade …</div>
    </div>
    <button class="primary" id="analyse">Jetzt analysieren</button>
  </header>

  <h2>Bereit für einen Vorschlag</h2>
  <div id="ready"></div>

  <h2>Fast so weit</h2>
  <div id="watching"></div>
  <details id="weak-box"><summary>Schwache Spuren anzeigen</summary><div id="weak"></div></details>

  <h2>Bereits automatisiert</h2>
  <div id="done"></div>

  <h2>Angelegte Automationen</h2>
  <div id="automations"></div>

  <h2>Vorschläge und Antworten</h2>
  <div id="suggestions"></div>

  <h2>Daten</h2>
  <div class="stats" id="stats"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = (x) => Math.round(x * 100);
const time = (ts) => ts ? new Date(ts * 1000).toLocaleString("de-DE",
  {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) : "–";

function bar(label, value, goal, progress) {
  return `<div><div class="bar-label"><span>${label}</span><span>${value} / ${goal}</span></div>
    <div class="track"><div class="fill ${progress >= 1 ? "full" : ""}"
      style="width:${pct(progress)}%"></div></div></div>`;
}

function card(p, t, showBars) {
  const other = p.other_spread == null ? "" :
    ` · ${p.anchor === "zeit" ? "Sonne" : "Uhrzeit"} hätte ±${Math.round(p.other_spread)} min`;
  const shadow = p.shadow.total
    ? `<span class="chip ${p.shadow.hits / p.shadow.total >= .8 ? "ok" : "warn"}">
         Schatten ${p.shadow.hits}/${p.shadow.total} richtig</span>` : "";
  const bars = showBars ? `<div class="bars">
      ${bar("Treffer", p.hits, t.hits, p.progress.hits)}
      ${bar("Quote", pct(p.rate) + " %", pct(t.rate) + " %", p.progress.rate)}
      ${bar("Streuung", "±" + Math.round(p.spread) + " min", "±" + t.spread + " min",
            p.progress.spread)}
    </div>` : "";
  return `<div class="card">
    <div class="row"><div><span class="title">${esc(p.name)}</span>
      <span class="sub"> → ${esc(p.action)}</span></div>${shadow}</div>
    <div class="why">${esc(p.when)} · ${p.hits} von ${p.chances} Tagen ·
      Streuung ±${Math.round(p.spread)} min${esc(other)}</div>${bars}</div>`;
}

function list(el, items, render, empty) {
  $(el).innerHTML = items.length ? items.map(render).join("") :
    `<div class="empty">${empty}</div>`;
}

function render(d) {
  const t = d.thresholds;
  const by = (s) => d.patterns.filter((p) => p.status === s);
  const watching = by("beobachtet").sort((a, b) => b.progress.total - a.progress.total);
  list("ready", by("bereit"), (p) => card(p, t, false),
       "Noch nichts – Muster brauchen mindestens " + t.hits + " gleiche Tage.");
  list("watching", watching, (p) => card(p, t, true), "Noch keine wiederkehrenden Spuren.");
  list("weak", by("schwach"), (p) => card(p, t, true), "Keine.");
  $("weak-box").style.display = by("schwach").length ? "" : "none";
  list("done", by("erledigt"), (p) => card(p, t, false), "Keine.");
  const text = Object.fromEntries(d.suggestions.map((s) => [s.id, s.text]));
  list("automations", d.automations, (a) => {
    const b = a.balance;
    const chip = a.status === "pausiert"
      ? `<span class="chip warn">pausiert – wird am ${time(a.delete_at)} gelöscht</span>`
      : `<span class="chip ok">aktiv</span>`;
    return `<div class="card"><div class="row"><span class="title">${esc(a.automation)}</span>
      ${chip}</div><div class="why">${esc(text[a.id] || "")}</div>
      <div class="why">${b.gelassen}× gelassen · ${b.korrigiert}× korrigiert ·
        ${b["rückgängig"]}× rückgängig</div></div>`;
  }, "Noch keine angelegt.");
  list("suggestions", d.suggestions, (s) => `<div class="card">
      <div class="row"><span class="chip">${esc(s.status)}</span>
        <span class="sub">${time(s.offered)}</span></div>
      <div class="why">${esc(s.text)}</div></div>`, "Noch keine Vorschläge verschickt.");

  const st = d.stats, sum = (pre) => Object.entries(st)
    .filter(([k]) => k.startsWith(pre)).reduce((a, [, v]) => a + v, 0);
  $("stats").innerHTML = [
    ["Aktionen", sum("action:")],
    ["davon von Hand", (st["action:manual"] || 0) + (st["action:device"] || 0)],
    ["Auslöser-Ereignisse", sum("trigger:")],
    ["Handys / Lautsprecher", `${d.discovery.phones} / ${d.discovery.speakers}`],
  ].map(([l, n]) => `<div class="card stat"><div class="n">${esc(n)}</div>
     <div class="sub">${l}</div></div>`).join("");

  $("meta").innerHTML = `<span><span class="dot" style="background:${d.connected
      ? "var(--ok)" : "var(--warn)"}"></span>${d.connected ? "verbunden" : "nicht verbunden"}</span>
    <span>Letzte Analyse: ${time(d.analysed_at)}</span>
    <span>Zeitraum: ${t.window_days} Tage</span>`;
}

async function load(method = "GET", path = "api/overview") {
  try {
    const r = await fetch(path, {method});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("meta").innerHTML = `<span class="error">Laden fehlgeschlagen (${esc(e.message)})</span>`;
  }
}

$("analyse").onclick = async (ev) => {
  ev.target.disabled = true;
  await load("POST", "api/analyse");
  ev.target.disabled = false;
};
load();
setInterval(load, 60000);
</script>
</body>
</html>
