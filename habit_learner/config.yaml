name: Habit Learner
version: "0.10.1"
slug: habit_learner
description: Erkennt wiederkehrende manuelle Aktionen und schlägt Automationen vor
url: https://github.com/janwo/habits4HA
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:head-lightbulb-outline
panel_title: Gewohnheiten
options:
  log_level: info
  retention_days: 180
  domains:
    - light
    - switch
    - scene
    - script
    - input_boolean
    - media_player
    - cover
  exclude_users: []
  trigger_entities: []
  presence_entities: []
  announce: false
  quiet_start: "22:00"
  quiet_end: "07:00"
  autopilot: false
schema:
  log_level: list(debug|info|warning|error)
  retention_days: int(7,3650)
  domains:
    - str
  exclude_users:
    - str
  trigger_entities:
    - str
  presence_entities:
    - str
  announce: bool
  quiet_start: match(^\d{2}:\d{2}$)
  quiet_end: match(^\d{2}:\d{2}$)
  autopilot: bool
